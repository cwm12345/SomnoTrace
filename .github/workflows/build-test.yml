name: build-test
on: { push: { branches: [test/format-fixes] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    container: { image: espressif/idf:v5.5.1 }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build + package
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build
          esptool.py --chip esp32s3 merge_bin --flash_mode dio --flash_freq 80m --flash_size 16MB \
            --output somnotrace-format-fixes-full.bin \
            0x0000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x9000 build/ota_data_initial.bin \
            0x10000 build/somnotrace.bin
      - uses: actions/upload-artifact@v4
        with:
          name: format-fixes-build
          path: |
            somnotrace-format-fixes-full.bin
            build/somnotrace.bin
          retention-days: 14
